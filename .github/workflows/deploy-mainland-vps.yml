name: Deploy VitePress to Mainland VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mainland-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ICP_BEIAN_NUMBER: ${{ secrets.ICP_BEIAN_NUMBER }}
      TMP_DEPLOY_PATH: /var/www/maayuan-docs-staging/incoming

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mainland deployment configuration
        env:
          MAINLAND_SERVER_HOST: ${{ secrets.MAINLAND_SERVER_HOST }}
          MAINLAND_SERVER_USER: ${{ secrets.MAINLAND_SERVER_USER }}
          MAINLAND_SERVER_SSH_KEY: ${{ secrets.MAINLAND_SERVER_SSH_KEY }}
          MAINLAND_SERVER_PORT: ${{ secrets.MAINLAND_SERVER_PORT }}
        run: |
          test -n "$ICP_BEIAN_NUMBER" || { echo "ICP_BEIAN_NUMBER repository variable is required"; exit 1; }
          test -n "$MAINLAND_SERVER_HOST" || { echo "MAINLAND_SERVER_HOST secret is required"; exit 1; }
          test -n "$MAINLAND_SERVER_USER" || { echo "MAINLAND_SERVER_USER secret is required"; exit 1; }
          test -n "$MAINLAND_SERVER_SSH_KEY" || { echo "MAINLAND_SERVER_SSH_KEY secret is required"; exit 1; }
          test -n "$MAINLAND_SERVER_PORT" || { echo "MAINLAND_SERVER_PORT secret is required"; exit 1; }

      - name: Build mainland VitePress application
        run: pnpm run docs:build

      - name: Prepare staging folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAINLAND_SERVER_HOST }}
          username: ${{ secrets.MAINLAND_SERVER_USER }}
          key: ${{ secrets.MAINLAND_SERVER_SSH_KEY }}
          port: ${{ secrets.MAINLAND_SERVER_PORT }}
          script_stop: true
          script: |
            set -eu
            rm -rf -- '${{ env.TMP_DEPLOY_PATH }}'
            mkdir -p -- '${{ env.TMP_DEPLOY_PATH }}'

      - name: Upload staged release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MAINLAND_SERVER_HOST }}
          username: ${{ secrets.MAINLAND_SERVER_USER }}
          key: ${{ secrets.MAINLAND_SERVER_SSH_KEY }}
          port: ${{ secrets.MAINLAND_SERVER_PORT }}
          source: .vitepress/dist/*
          target: ${{ env.TMP_DEPLOY_PATH }}/
          overwrite: true
          strip_components: 2

      - name: Atomically switch release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAINLAND_SERVER_HOST }}
          username: ${{ secrets.MAINLAND_SERVER_USER }}
          key: ${{ secrets.MAINLAND_SERVER_SSH_KEY }}
          port: ${{ secrets.MAINLAND_SERVER_PORT }}
          script_stop: true
          script: |
            set -eu
            sudo -n /usr/local/sbin/deploy-maayuan-docs
